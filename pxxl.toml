# Pxxl: use managed Nuxt/Node runtime (not custom Docker image scan).
# Local Docker builds still use Dockerfile.local via docker-compose.prod.yml.

[build]
# Include devDependencies so postinstall `nuxt prepare` / `nuxt build` can load modules.
install = "npm ci --include=dev"
command = "npm run build"

[start]
command = "node .output/server/index.mjs"

[app]
port = 3000
